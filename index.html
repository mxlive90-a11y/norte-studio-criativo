<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; color: #222; }
    header { background: #111; color: #fff; padding: 30px 20px; text-align: center; position: relative; }
    .btn-carrinho-topo { position: fixed; top: 16px; right: 16px; z-index: 900; background: #0a7; color: #fff; border: none; padding: 11px 16px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.25); }

    /* Barra de CEP em destaque */
    .barra-cep-topo { background: #0033c6; color: #fff; padding: 10px 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
    .barra-cep-interna { max-width: 960px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
    .cep-chamada { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .cep-chamada strong { font-size: 14px; }
    .cep-form-topo { display: flex; align-items: center; gap: 6px; }
    .cep-form-topo input { padding: 7px 11px; border: none; border-radius: 6px; font-size: 14px; width: 155px; outline: none; }
    .cep-form-topo button { background: #e11d48; color: #fff; border: none; padding: 7px 14px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; text-transform: uppercase; }
    .cep-form-topo button:hover { background: #be123c; }
    .cep-resultado-topo { font-size: 13px; color: #dbeafe; width: 100%; }

    main { max-width: 960px; margin: 28px auto; padding: 0 16px; }
    h2 { margin: 0 0 16px; }

    /* Slider */
    .slider-wrapper { margin-bottom: 28px; }
    .slider-viewport { position: relative; width: 100%; overflow: hidden; border-radius: 12px; }
    .slider-trilho { display: flex; width: 100%; transition: transform 0.45s ease; }
    .slide { flex: 0 0 100%; width: 100%; box-sizing: border-box; height: 230px; border-radius: 12px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; padding: 24px 32px; color: #fff; }
    .slide img.bg-slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.22; z-index: 0; }
    .slide-conteudo { position: relative; z-index: 2; max-width: 62%; text-align: left; }
    .slide-tag { display: inline-block; background: #fff; color: #111; font-weight: 900; font-size: 12px; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
    .slide-conteudo h3 { margin: 0 0 8px; font-size: 28px; font-weight: 900; line-height: 1.15; text-transform: uppercase; }
    .slide-conteudo p { margin: 0 0 14px; font-size: 14px; color: #f0f0f0; }
    .slide-btn { display: inline-block; background: #e11d48; color: #fff; border: none; padding: 9px 18px; border-radius: 20px; font-weight: bold; font-size: 13px; text-transform: uppercase; cursor: pointer; text-decoration: none; }
    .slide-btn:hover { background: #be123c; }
    .slide-destaque-img { position: relative; z-index: 2; flex-shrink: 0; width: 150px; height: 150px; border-radius: 12px; object-fit: cover; box-shadow: 0 6px 16px rgba(0,0,0,0.35); background: rgba(255,255,255,0.12); }

    .slider-seta { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.45); color: #fff; border: none; width: 34px; height: 34px; border-radius: 50%; font-size: 16px; cursor: pointer; z-index: 10; }
    .slider-seta:hover { background: rgba(0,0,0,0.75); }
    .slider-seta.ant { left: 10px; }
    .slider-seta.prox { right: 10px; }

    .slider-pontos { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 12px; }
    .ponto { width: 10px; height: 10px; border-radius: 50%; background: #d1d5db; border: none; cursor: pointer; padding: 0; transition: all 0.25s ease; }
    .ponto.ativo { width: 13px; height: 13px; background: #0033c6; }
